plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.16.0'
    id 'jacoco'
    id 'checkstyle'
}

group = 'com.challenge'
version = '1.0.1-SNAPSHOT'
description = 'Product microservice for product management'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

openApiGenerate {
    generatorName.set("spring")
    inputSpec.set("$projectDir/src/main/resources/openapi/product-api.yaml")
    outputDir.set("${layout.buildDirectory.get()}/generated")

    apiPackage.set("com.challenge.product.api")
    modelPackage.set("com.challenge.product.model")
    invokerPackage.set("com.challenge.product.invoker")

    configOptions.set([
            useSpringBoot3        : "true",
            reactive              : "true",
            interfaceOnly         : "true",
            documentationProvider : "springdoc",
            dateLibrary           : "java8"
    ])
}

sourceSets {
    main {
        java {
            srcDir "${layout.buildDirectory.get()}/generated/src/main/java"
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.6.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.8'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'

    runtimeOnly 'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('javadoc') {
    source = fileTree('src/main/java') {
        include '**/*.java'
    }
    classpath = sourceSets.main.compileClasspath
}

// ========================================
// CONFIGURACION DE JACOCO (CODE COVERAGE)
// ========================================
jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/model/**',           // Excluir modelos generados
                    '**/api/**',             // Excluir API generada
                    '**/invoker/**',         // Excluir invoker generado
                    '**/*Application.class'  // Excluir clase principal
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.70  // 70% de cobertura minima
            }
        }
    }
}

test {
    finalizedBy jacocoTestReport
}

// ========================================
// CONFIGURACION DE CHECKSTYLE
// ========================================
checkstyle {
    toolVersion = '10.12.5'
    configFile = file("${project.rootDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = false
    maxWarnings = 0
}

checkstyleMain {
    source = 'src/main/java'
}

checkstyleTest {
    source = 'src/test/java'
}

