# Configuracion de logging mas detallada
logging.level.com.challenge.product=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.reactor.netty=DEBUG

# Base de datos H2 con consola habilitada
spring.h2.console.enabled=true
spring.jpa.show-sql=true

# Mostrar SQL formateado
spring.jpa.properties.hibernate.format_sql=true

# Servicio de inventario local
inventory.service.base-url=http://localhost:8082

