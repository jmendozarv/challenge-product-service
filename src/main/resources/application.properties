# ========================================
# CONFIGURACION DE PRODUCT SERVICE
# ========================================

# Nombre de la aplicacion
spring.application.name=product-service

# Puerto del servidor
server.port=8081

# ========================================
# CONFIGURACION DE BASE DE DATOS H2
# ========================================

# URL de conexion a H2 en memoria
spring.datasource.url=jdbc:h2:mem:productdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

# Consola H2 para inspeccion de datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================
# CONFIGURACION DE SERVICIOS EXTERNOS
# ========================================

# URL del servicio de inventario
inventory.service.base-url=http://localhost:8082

# ========================================
# CONFIGURACION DE LOGGING
# ========================================

# Nivel de log por defecto
logging.level.root=INFO

# Nivel de log para paquetes de la aplicacion
logging.level.com.challenge.product=DEBUG

# Formato de salida de logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

