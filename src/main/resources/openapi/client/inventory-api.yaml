openapi: 3.0.3
info:
  title: Inventory Service API
  version: 1.0.0
  description: API para la gestión de inventario y stock de productos.

servers:
  - url: http://localhost:8082
    description: Local

tags:
  - name: Inventory
    description: Operaciones sobre inventario

paths:
  /inventory:
    get:
      tags:
        - Inventory
      summary: Listar inventario
      description: Retorna la lista de inventario registrada.
      operationId: getAllInventory
      responses:
        '200':
          description: Lista de inventario obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryResponse'
        '500':
          description: Error interno inesperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Inventory
      summary: Crear registro de inventario
      description: Crea un nuevo registro de inventario para un producto.
      operationId: createInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryRequest'
            examples:
              inventoryExample:
                value:
                  productId: 1
                  stock: 20
      responses:
        '201':
          description: Inventario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno inesperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inventory/{productId}:
    get:
      tags:
        - Inventory
      summary: Obtener inventario por productId
      description: Retorna el inventario asociado a un producto.
      operationId: getInventoryByProductId
      parameters:
        - name: productId
          in: path
          required: true
          description: ID del producto
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Inventario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '404':
          description: Inventario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno inesperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    InventoryRequest:
      type: object
      required:
        - productId
        - stock
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        stock:
          type: integer
          example: 20

    InventoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        productId:
          type: integer
          format: int64
          example: 1
        stock:
          type: integer
          example: 20

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer
          example: 404
        timestamp:
          type: string
          format: date-time
          example: 2026-03-07T10:15:30