openapi: 3.0.3
info:
  title: Product Service API
  version: 1.0.0
  description: API para la gestión de productos.

servers:
  - url: http://localhost:8081
    description: Local

tags:
  - name: Products
    description: Operaciones sobre productos

paths:
  /products:
    get:
      tags:
        - Products
      summary: Listar productos
      description: Retorna la lista de productos registrados.
      operationId: getAllProducts
      responses:
        '200':
          description: Lista de productos obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'

    post:
      tags:
        - Products
      summary: Crear producto
      description: Crea un nuevo producto.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
            examples:
              productExample:
                value:
                  name: Laptop
                  price: 1200.00
      responses:
        '201':
          description: Producto creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}:
    get:
      tags:
        - Products
      summary: Obtener producto por ID
      description: Retorna un producto por su identificador.
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          description: ID del producto
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductWithStockResponse'
        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/filter/expensive:
    get:
      tags:
        - Products
      summary: Listar productos costosos
      description: Retorna productos con precio mayor al valor enviado por query param.
      operationId: getExpensiveProducts
      parameters:
        - name: minPrice
          in: query
          required: true
          description: Precio mínimo para filtrar productos
          schema:
            type: number
            format: double
            example: 500.00
      responses:
        '200':
          description: Lista filtrada correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Parámetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ProductRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: Laptop
        price:
          type: number
          format: double
          example: 1200.00

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Laptop
        price:
          type: number
          format: double
          example: 1200.00

    ProductWithStockResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Laptop
        price:
          type: number
          format: double
          example: 1200.00
        stock:
          type: integer
          example: 20

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Product not found
        status:
          type: integer
          example: 404
        timestamp:
          type: string
          format: date-time
          example: 2026-03-07T10:15:30